services:
  db:
    image: pgvector/pgvector:pg17
    container_name: memory_base_db
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: memory
      POSTGRES_DB: memory_base
    ports:
      - "5439:5432"
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT to the host directory holding all state}/pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: memory_base_redis
    command: redis-server --appendonly yes
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT to the host directory holding all state}/redis:/data

  api:
    build: .
    container_name: memory_base_api
    depends_on: [db, redis]
    ports:
      - "8010:8010"
    environment:
      DB_URL: postgres://memory:memory@db:5432/memory_base
      COCOINDEX_DB: /data/cocoindex_state
      EMB_URL: ${EMB_URL}
      RERANK_URL: ${RERANK_URL}
      LLM_URL: ${LLM_URL}
      REPO_CACHE: /data/repos_cache
      REDIS_URL: redis://redis:6379/0
    # ponytail: repo clones and the CocoIndex ledger live here; losing either
    # directory orphans code_chunks rows until the repos are re-added.
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT to the host directory holding all state}/repos_cache:/data/repos_cache
      - ${DATA_ROOT:?set DATA_ROOT to the host directory holding all state}/cocoindex_state:/data/cocoindex_state
    command: uv run --no-sync uvicorn memory_base.serve.api:app --host 0.0.0.0 --port 8010
    # /health is liveness only; /health/services is the one that reaches the vLLM endpoints.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8010/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    build: .
    container_name: memory_base_mcp
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8765:8765"
    environment:
      MCP_TRANSPORT: sse
      REST_URL: http://api:8010
