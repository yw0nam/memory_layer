services:
  db:
    build:
      context: .
      dockerfile: db.Dockerfile
    container_name: memory_base_db
    restart: unless-stopped
    command: postgres -c shared_preload_libraries=pg_textsearch
    environment:
      POSTGRES_USER: memory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: memory_base
    ports:
      - "5439:5432"
    volumes:
      - ${DATA_ROOT:?set DATA_ROOT to the host directory holding all state}/pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: memory_base_api
    restart: unless-stopped
    depends_on: [db]
    ports:
      - "8010:8010"
    environment:
      DB_URL: postgres://memory:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/memory_base
      EMB_URL: ${EMB_URL}
      RERANK_URL: ${RERANK_URL}
      EMB_MODEL: ${EMB_MODEL}
      RERANK_MODEL: ${RERANK_MODEL}
    command: uv run --no-sync uvicorn memory_base.serve.api:app --host 0.0.0.0 --port 8010
    # /health is liveness only; /health/services is the one that reaches the vLLM endpoints.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8010/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  mcp:
    build: .
    container_name: memory_base_mcp
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8765:8765"
    environment:
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      MCP_TRANSPORT: streamable-http
      REST_URL: http://api:8010
