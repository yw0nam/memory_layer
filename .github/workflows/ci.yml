name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv lock --check
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  test:
    name: test (pytest, unit)
    runs-on: ubuntu-latest
    # Integration tests need the local DB + vLLM endpoints; CI runs unit only.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "not integration"

  test-guard:
    name: test-guard (tests accompany source)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so we can diff against the PR base
      - name: Enforce that source changes ship tests
        env:
          TEST_GUARD_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-tests') && '1' || '' }}
        run: bash scripts/ci/test-guard.sh "origin/${{ github.event.pull_request.base.ref }}"

  pr-title:
    name: pr-title (conventional + english)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Conventional-commit type set; PR titles become squash-merge commit subjects.
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          # Tracker content is English: the subject must be printable ASCII.
          subjectPattern: ^[\x20-\x7E]+$
          subjectPatternError: |
            The PR title subject must be written in English (printable ASCII).
            GitHub tracker content is English-only (AGENTS.md).
