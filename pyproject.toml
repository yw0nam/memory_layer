[project]
name = "memory-base"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cocoindex[postgres]>=1.0.17",
    "httpx>=0.28.1",
    "mcp>=1.28.1",
    "numpy>=2.5.1",
    "openai>=2.46.0",
    "pgvector>=0.5.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["integration: requires local DB/vLLM services"]
testpaths = ["tests"]
