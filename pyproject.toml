[project]
name = "memory-base"
version = "0.1.0"
description = "Selective memory layer: distilled agent-history and code retrieval over pgvector"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cocoindex[postgres]>=1.0.17",
    "httpx>=0.28.1",
    "markitdown[docx,pdf,pptx]~=0.1.0",
    "mcp>=1.28.1",
    "numpy>=2.5.1",
    "openai>=2.46.0",
    "python-dotenv>=1.2.2",
    "python-multipart",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff",
]

[tool.pytest.ini_options]
markers = ["integration: requires local DB/vLLM services"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_base"]

[tool.ruff]
target-version = "py312"
line-length = 100
