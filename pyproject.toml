[project]
name = "memory-base"
version = "0.3.0"
description = "Selective memory layer: distilled agent-history and code retrieval over pgvector"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cocoindex[postgres]>=1.0.17",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "markitdown[docx,pdf,pptx]~=0.1.0",
    "mcp>=1.28.1",
    "numpy>=2.5.1",
    "openai>=2.46.0",
    "python-dotenv>=1.2.2",
    "python-multipart",
    "starlette>=1.3.1",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.2",
    "ruff",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires local DB/vLLM services",
    "real_auth: exercises the real API-key auth path instead of the tests/serve stub",
]
testpaths = ["tests"]
pythonpath = ["scripts", "integrations/hermes/memory_base"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_base"]

[tool.ruff]
target-version = "py312"
line-length = 100
